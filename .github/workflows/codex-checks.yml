name: Codex adaptation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portable-tools:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests-codex -v
      - run: python skills/game-studios/scripts/studio.py verify
